name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build production
        run: NODE_ENV=production pnpm build

      - name: Create release zip
        run: |
          mkdir -p release/listening-stats
          cp dist/extension.js dist/index.js dist/manifest.json release/listening-stats/
          node -e "const fs=require('fs'); const pre=String(process.env.RELEASE_PRE).toLowerCase()==='true'; fs.writeFileSync('release/latest-release.json', JSON.stringify({ tag: process.env.RELEASE_TAG, prerelease: pre }))"
          cd release && zip -r ../listening-stats.zip listening-stats/
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRE: ${{ github.event.release.prerelease }}

      - name: Upload release asset
        run: gh release upload "${{ github.event.release.tag_name }}" listening-stats.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist-temp
          git rm -rf .
          # Loose build artifacts at branch root (no unzip needed for raw.githubusercontent.com)
          cp dist/extension.js dist/index.js dist/manifest.json .
          # Same paths as inside listening-stats.zip (CustomApps/listening-stats/)
          mkdir -p listening-stats
          cp dist/extension.js dist/index.js dist/manifest.json listening-stats/
          cp release/latest-release.json .
          cp listening-stats.zip .
          git add extension.js index.js manifest.json listening-stats latest-release.json listening-stats.zip
          git commit -m "Release ${{ github.event.release.tag_name }}"
          git push origin dist-temp:dist --force
